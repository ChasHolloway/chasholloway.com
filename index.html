<!DOCTYPE html>
<html>
<head>
    <title>Chas Holloway</title>

    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
        }
        .hero {
    height: 650px;
    background-image: url('sec1bg.png');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero-text h1 {
    font-size: 64px;
    margin: 0;
}

.hero-text h2 {
    font-size: 30px;
    margin: 15px 0 8px;
}

.hero-text p {
    font-size: 22px;
    margin: 0;
}
        .tiles-section {
    padding: 80px 6% 100px;
    background-color: #000000;
}

.tiles {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    gap: 40px;
}

.tile {
    flex: 1;
    max-width: 360px;
}

.tile img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    border: 2px solid #173b8f;
    box-sizing: border-box;
}

@media (max-width: 800px) {
    .tiles {
        flex-direction: column;
        align-items: center;
    }

    .tile {
        width: 90%;
    }
}
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-text">
            <h1>Chas Holloway</h1>
            <h2>Inventor of the Freedom-Constraint Process</h2>
            <p>Creator of Free World Theory</p>
        </div>
    </section>

<section class="tiles-section">
    <div class="tiles">

        <a class="tile" href="fwt.html">
            <img src="fwt.jpeg" alt="Free World Theory">
        </a>

        <a class="tile" href="fc.html">
            <img src="FC.jpg" alt="Freedom-Constraint">
        </a>

        <a class="tile" href="thinkopolis.html">
            <img src="think.png" alt="Thinkopolis">
        </a>

    </div>
</section>
    
</body>
</html>
