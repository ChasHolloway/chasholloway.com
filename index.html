<!DOCTYPE html>
<html>
<head>
    <title>Chas Holloway</title>

    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
        }
        .hero {
    height: 650px;
    background-image: url('sec1bg.png');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero-text h1 {
    font-size: 64px;
    margin: 0;
}

.hero-text h2 {
    font-size: 30px;
    margin: 15px 0 8px;
}

.hero-text p {
    font-size: 22px;
    margin: 0;
}
        .tiles-section {
    padding: 80px 6% 100px;
    background-color: #000000;
}

.tiles {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    gap: 40px;
}

.tile {
    flex: 1;
    max-width: 360px;
}

.tile img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    border: 2px solid #173b8f;
    box-sizing: border-box;
}

.tile video {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    display: block;
    border: 2px solid #173b8f;
    box-sizing: border-box;
    background-color: #000000;
}

@media (max-width: 800px) {
    .tiles {
        flex-direction: column;
        align-items: center;
    }

    .tile {
        width: 90%;
    }
}
.quote-strip {
    background-color: #d80d0d;
    color: #ffffff;
    text-align: center;
    padding: 28px 10%;
    box-sizing: border-box;
}

.quote-strip blockquote {
    margin: 0 auto;
    max-width: 900px;
    font-size: 30px;
    font-style: italic;
    line-height: 1.35;
}

.quote-strip .author {
    margin-top: 24px;
    font-size: 22px;
    font-style: normal;
}

.about-section {
    background-color: #000000;
    padding: 100px 20px 120px;
    text-align: center;
}

.about-link {
    display: inline-block;
    text-decoration: none;
    color: #ffffff;
}

.about-link img {
    width: 420px;
    max-width: 85vw;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    border: 2px solid #173b8f;
    box-sizing: border-box;
}

.about-title {
    margin-top: 22px;
    font-size: 28px;
    font-weight: bold;
}
        
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-text">
            <h1>Chas Holloway</h1>
            <h2>Inventor of the Freedom-Constraint Process</h2>
            <p>Creator of Free World Theory</p>
        </div>
    </section>

<section class="tiles-section">
    <div class="tiles">

<a class="tile" href="fwt.html">
    <video autoplay muted loop playsinline>
        <source src="FWT ballet 2.mp4" type="video/mp4">
    </video>
</a>

        <a class="tile" href="fc.html">
            <img src="FC.jpg" alt="Freedom-Constraint">
        </a>

        <a class="tile" href="thinkopolis.html">
            <img src="think.png" alt="Thinkopolis">
        </a>

    </div>
</section>

<section class="quote-strip">
    <blockquote>
        “I don’t know why people are afraid of new ideas. I’m afraid of the old ones.”
        <div class="author">— John Cage</div>
    </blockquote>
</section>

<section class="about-section">
    <a class="about-link" href="about.html">
        <img src="about.png" alt="About Chas Holloway">
        <div class="about-title">About Chas Holloway</div>
    </a>
</section>
    
</body>
</html>
